name: Build APK

on:
  # 手动触发（点击 Actions 页面的 Run workflow 按钮）
  workflow_dispatch:
  # 每次推送到 master 分支时自动构建
  push:
    branches: [ master, main ]
  # 每次创建 Pull Request 时自动构建
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. 设置 JDK 17（Android Gradle Plugin 9.2.1 需要 JDK 17+）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # 3. 缓存 Gradle 依赖，加快后续构建速度
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      # 4. 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # 5. 构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      
      # 6. 构建 Release APK（可选，如需 Release 版请取消注释下面两行）
      # - name: Build Release APK
      #   run: ./gradlew assembleRelease
      
      # 7. 上传 Debug APK 作为构建产物（可下载）
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      
      # 8. 上传 Release APK 作为构建产物（可选，如需 Release 版请取消注释下面四行）
      # - name: Upload Release APK
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-release
      #     path: app/build/outputs/apk/release/app-release-unsigned.apk
